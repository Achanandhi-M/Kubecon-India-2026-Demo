customRules:
  custom-rules.yaml: |-
    - rule: Cryptominer Process Detected
      desc: Detects processes commonly used for cryptomining simulation
      condition: >
        spawned_process and container and
        (proc.name in (dd, stress, stress-ng, xmrig, minerd) or
         proc.cmdline contains "if=/dev/zero")
      output: >
        Cryptominer-like process detected!
        (user=%user.name command=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
      priority: CRITICAL
      tags: [cryptomining, container, attack]

    - rule: Sensitive Token Read
      desc: Detects reading of Kubernetes service account token
      condition: >
        open_read and container and
        fd.name = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      output: >
        K8s SA token read by process!
        (user=%user.name command=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name)
      priority: CRITICAL
      tags: [credential-access, T1528, container]

    - rule: Unexpected Outbound Network Tool
      desc: Detects wget or curl used inside a container
      condition: >
        spawned_process and container and
        proc.name in (wget, curl, nc, ncat, netcat)
      output: >
        Suspicious network tool executed in container!
        (user=%user.name command=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name image=%container.image.repository)
      priority: WARNING
      tags: [network, T1105, container, lateral-movement]
